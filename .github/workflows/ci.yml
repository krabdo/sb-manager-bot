name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test browser credential helpers
        run: node --test userscript/*.test.js extension/chrome/*.test.js
      - name: Package Chrome extension
        run: |
          mkdir -p dist
          cd extension/chrome
          zip -q -r ../../dist/sb-manager-bot-chrome.zip manifest.json popup.html popup.css popup.js credential.js README.md
      - name: Static cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/sb-manager-bot-amd64 ./cmd/sb-manager-bot
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/sb-manager-bot-arm64 ./cmd/sb-manager-bot
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: sb-manager-bot-chrome
          path: dist/sb-manager-bot-chrome.zip
          if-no-files-found: error

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/krabdo/sb-manager-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/krabdo/sb-manager-bot
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sb-manager-bot:smoke
          build-args: VERSION=sha-${{ github.sha }}
      - name: Image version and readiness smoke
        run: |
          docker run --rm sb-manager-bot:smoke --version
          python3 test/mock_telegram.py &
          MOCK_PID=$!
          KEY=$(openssl rand -base64 32 | tr -d '\n')
          docker run -d --name sb-manager-smoke --network host --tmpfs /data:uid=65532,gid=65532 \
            -e TELEGRAM_BOT_TOKEN=123456789:test \
            -e CREDENTIAL_ENCRYPTION_KEY="$KEY" \
            -e ADMIN_TELEGRAM_IDS=123456789 \
            -e TELEGRAM_API_URL=http://127.0.0.1:18080 \
            -e HTTP_ADDR=:18081 sb-manager-bot:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18081/readyz
          docker rm -f sb-manager-smoke
          kill "$MOCK_PID"
      - name: Build and publish multi-architecture image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
